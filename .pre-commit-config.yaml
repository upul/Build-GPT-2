# Install once per clone:  uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # Training artifacts are large: a 200 MB shard or a 1.5 GB checkpoint
      # must never reach a commit, even if .gitignore is edited by accident.
      - id: check-added-large-files
        args: [--maxkb=512]
