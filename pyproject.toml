[project]
name = "build-gpt-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.0.1",
    "tiktoken>=0.13.0",
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "wandb>=0.30.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/build_gpt2"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Notebooks are exploratory scratch, not shipped code.
extend-exclude = ["notebooks", "scratch"]

[tool.ruff.lint]
# E/F  pyflakes + pycodestyle errors
# I    import sorting
# UP   pyupgrade (keep syntax current for the pinned Python)
# B    bugbear (mutable defaults, loop-variable capture, ...)
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The pre-refactor monolith is kept verbatim as a reference implementation.
"train_gpt.py" = ["ALL"]
